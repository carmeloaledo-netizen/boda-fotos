# Despliegue en Render (contenedor Docker + PostgreSQL gestionado).
# Render es tan sencillo como Netlify PERO ejecuta un contenedor real, así que
# NO tiene el límite de 6 MB de las funciones serverless: aguanta las fotos de
# 25 MB en streaming. Pasos:
#   1. Sube el repo a GitHub.
#   2. En Render: New → Blueprint → selecciona el repo (usa este render.yaml).
#   3. Rellena las variables marcadas como sync:false (secretas) en el panel.
#   4. Deploy. Render construye el Dockerfile y crea la base de datos.
services:
  - type: web
    name: boda-fotos
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # sube de plan si esperas mucho tráfico simultáneo
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boda-fotos-db
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "1"
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        sync: false # p.ej. https://boda-fotos.onrender.com (o tu dominio)
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false # JSON de la cuenta de servicio (modo A)
      - key: GOOGLE_DRIVE_SHARED_DRIVE_ID
        sync: false # ID de tu Unidad compartida
      - key: MAX_FILE_SIZE_BYTES
        value: "26214400"
      - key: MAX_FILES_PER_BATCH
        value: "20"
      - key: RETENTION_DAYS
        value: "365"

databases:
  - name: boda-fotos-db
    plan: basic-256mb # ajusta según volumen
    databaseName: boda
    user: boda
